<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>联系我们 | 工具优选</title>
  <meta name="description" content="如有任何问题、建议或合作意向，欢迎通过联系表单与我们取得联系。工具优选期待与您的沟通。">
  <meta name="keywords" content="联系我们,工具优选,反馈,合作">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- 头部导航 -->
  <header class="site-header">
    <div class="container">
      <div class="site-brand"><a href="./index.html">工具优选</a></div>
      <nav class="main-nav" aria-label="主导航">
        <ul>
          <li><a href="./index.html">首页</a></li>
          <li><a href="./about.html">关于我们</a></li>
          <li><a href="./contact.html">联系我们</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <!-- 主体内容 -->
  <main class="site-main" id="main-content">
    <div class="container">
      <article class="content-page">

        <h1>联系我们</h1>
        <p>如果您有任何问题、建议，或者希望推荐优秀的工具给我们，欢迎填写下方表单与我们取得联系。我们会在收到消息后尽快回复。</p>

        <form class="contact-form" action="#" method="post" aria-label="联系表单">
          <div class="form-group">
            <label for="name">姓名 <span aria-label="必填">*</span></label>
            <input type="text" id="name" name="name" required placeholder="请输入您的姓名">
          </div>

          <div class="form-group">
            <label for="email">邮箱 <span aria-label="必填">*</span></label>
            <input type="email" id="email" name="email" required placeholder="请输入您的邮箱地址">
          </div>

          <div class="form-group">
            <label for="message">留言 <span aria-label="必填">*</span></label>
            <textarea id="message" name="message" required placeholder="请输入您想对我们说的话..."></textarea>
          </div>

          <button type="submit" class="btn btn-primary">提交留言</button>
        </form>

      </article>
    </div>
  </main>

  <!-- 页脚 -->
  <footer class="site-footer">
    <div class="container">
      <div class="footer-grid">
        <div class="footer-section">
          <h3>关于</h3>
          <ul>
            <li><a href="./about.html">关于我们</a></li>
            <li><a href="./privacy.html">隐私政策</a></li>
            <li><a href="./terms.html">服务条款</a></li>
          </ul>
        </div>
        <div class="footer-section">
          <h3>联系</h3>
          <ul>
            <li><a href="./contact.html">联系我们</a></li>
          </ul>
        </div>
      </div>
      <div class="footer-bottom">
        <p>&copy; 2026 工具优选. 保留所有权利。</p>
      </div>
    </div>
  </footer>

  <!-- Cookie 同意弹窗 -->
  <div class="cookie-banner" id="cookie-banner" role="dialog" aria-label="Cookie 同意">
    <div class="container">
      <p>我们使用 Cookie 来提升您的浏览体验。继续浏览即表示您同意我们的 <a href="./privacy.html">隐私政策</a>。</p>
      <div class="cookie-actions">
        <button class="btn btn-accept" id="cookie-accept">同意</button>
        <button class="btn btn-decline" id="cookie-decline">拒绝</button>
      </div>
    </div>
  </div>

  <!-- 返回顶部按钮 -->
  <button class="back-to-top" id="back-to-top" aria-label="返回顶部" title="返回顶部">&#8593;</button>

  <script src="js/cookie-consent.js"></script>
</body>
</html>
